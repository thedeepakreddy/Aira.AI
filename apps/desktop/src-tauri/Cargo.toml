[package]
name = "aira"
version = "0.1.0"
description = "Aira — your AI workspace"
authors = ["AskDeepakAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
